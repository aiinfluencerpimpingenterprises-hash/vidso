<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faceless YT Channel · Vidso</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --txt:#fff;
    --a1:#ff0033;
    --hustle-row:clamp(64px,12.5vh,96px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden}
  body{
    font-family:'Archivo Black',Impact,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .hustle-section{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .hustle-spin{
    position:relative;
    width:100%;
    height:100dvh;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
  }
  .hustle-spin-viewport{
    position:absolute;inset:0;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 8%,#000 92%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0%,#000 8%,#000 92%,transparent 100%);
  }
  .hustle-spin-track{will-change:transform}
  .hustle-spin-item{
    height:var(--hustle-row);
    display:flex;align-items:center;justify-content:center;
    font-weight:400;
    font-size:clamp(26px,5.8vw,64px);
    letter-spacing:.02em;
    line-height:1;
    text-transform:uppercase;
    color:#fff;
    white-space:nowrap;
    padding:0 88px 0 24px;
  }
  .hustle-spin-mark{
    position:absolute;
    left:50%;
    top:50%;
    width:22px;height:calc(var(--hustle-row) * .78);
    margin-left:min(28vw, 290px);
    transform:translateY(-50%);
    pointer-events:none;
    z-index:2;
  }
  .hustle-spin-mark::before,.hustle-spin-mark::after{
    content:'';
    position:absolute;right:0;
    width:18px;height:18px;
    border:3px solid var(--a1);
  }
  .hustle-spin-mark::before{top:0;border-left:0;border-bottom:0}
  .hustle-spin-mark::after{bottom:0;border-left:0;border-top:0}
  @media(max-width:720px){
    .hustle-spin-item{font-size:clamp(20px,7.2vw,36px);padding:0 48px 0 16px}
    .hustle-spin-mark{margin-left:0;right:16px;left:auto}
  }
</style>
</head>
<body>
<section class="hustle-section" aria-label="Side hustle reel">
  <div class="hustle-spin" id="hustle-spin" role="img" aria-label="FACELESS YT CHANNEL">
    <span class="sr-only" data-hustle-live>FACELESS YT CHANNEL</span>
    <div class="hustle-spin-viewport">
      <div class="hustle-spin-track" data-hustle-track></div>
    </div>
    <div class="hustle-spin-mark" aria-hidden="true"></div>
  </div>
</section>
<script type="module">
import { mountHustleSpin } from '/lib/hustle-spin.js'
mountHustleSpin(document.getElementById('hustle-spin'))
</script>
</body>
</html>
