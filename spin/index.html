<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faceless YT Channel · Vidso</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506;
    --txt:#fff;
    --a1:#ff0033;
    --hustle-row:clamp(76px,11vh,108px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden}
  body{
    font-family:'Bricolage Grotesque',Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .hustle-section{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .hustle-spin{
    position:relative;
    width:100%;
    height:100dvh;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
  }
  .hustle-spin-viewport{
    position:absolute;inset:0;overflow:hidden;
    perspective:900px;
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 16%,#000 84%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0%,#000 16%,#000 84%,transparent 100%);
  }
  .hustle-spin-track{transform-style:preserve-3d;will-change:transform}
  .hustle-spin-item{
    height:var(--hustle-row);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:clamp(28px,7.2vw,92px);
    letter-spacing:-.035em;
    line-height:1;
    text-transform:uppercase;
    color:#fff;
    white-space:nowrap;
    padding:0 96px 0 24px;
    transform-origin:50% 50%;
  }
  .hustle-spin-item.is-win.is-center{text-shadow:0 0 32px rgba(255,0,51,.3)}
  .hustle-spin-mark{
    position:absolute;
    left:50%;
    top:50%;
    width:28px;height:104px;
    margin-left:min(40vw, 400px);
    transform:translateY(-50%);
    pointer-events:none;
    z-index:2;
  }
  .hustle-spin-mark::before,.hustle-spin-mark::after{
    content:'';
    position:absolute;right:0;
    width:26px;height:26px;
    border:3.5px solid var(--a1);
  }
  .hustle-spin-mark::before{top:0;border-left:0;border-bottom:0}
  .hustle-spin-mark::after{bottom:0;border-left:0;border-top:0}
  .hustle-spin.is-landed .hustle-spin-mark{filter:drop-shadow(0 0 10px rgba(255,0,51,.55))}
  @media(max-width:720px){
    .hustle-spin-item{font-size:clamp(22px,8.6vw,42px);padding:0 56px 0 16px}
    .hustle-spin-mark{margin-left:0;right:14px;left:auto;height:72px}
  }
</style>
</head>
<body>
<section class="hustle-section" aria-label="Side hustle reel">
  <div class="hustle-spin" id="hustle-spin" role="img" aria-label="FACELESS YT CHANNEL">
    <span class="sr-only" data-hustle-live>FACELESS YT CHANNEL</span>
    <div class="hustle-spin-viewport">
      <div class="hustle-spin-track" data-hustle-track></div>
    </div>
    <div class="hustle-spin-mark" aria-hidden="true"></div>
  </div>
</section>
<script type="module">
import { mountHustleSpin } from '/lib/hustle-spin.js'
mountHustleSpin(document.getElementById('hustle-spin'))
</script>
</body>
</html>
