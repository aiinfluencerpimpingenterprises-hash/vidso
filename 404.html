<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Page not found · Vidso</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root{color-scheme:dark;--bg:#0B0B0C;--ink:#F5F5F4;--muted:rgba(245,245,244,.7);--a1:#E94B58;--grad:linear-gradient(135deg,#F0606C 0%,#B31D2C 100%)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;text-align:center;padding:32px}
  main{position:relative;z-index:1;max-width:440px}
  h1{font-size:clamp(40px,8vw,64px);letter-spacing:-.04em;margin-bottom:8px}
  p{color:var(--muted);line-height:1.55;margin-bottom:28px}
  a{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:12px;background:var(--grad);color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body data-topo="subtle">
<canvas id="topo-bg" data-mode="subtle" aria-hidden="true"></canvas>
<main>
  <h1>404</h1>
  <p>This page doesn’t exist. Head back home and keep building long-form.</p>
  <a href="/home">Back to Vidso</a>
</main>
<script src="/topo-bg.js"></script>
</body>
</html>
