<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vidso</title>
<link rel="canonical" href="/home"/>
<script>
(function(){
  var h = location.hash || ''
  var s = location.search || ''
  var oauth = /access_token=/.test(h + s) || /(?:[?&#])(?:code|error)=/.test(h + s)
  location.replace((oauth ? '/login' : '/home') + s + h)
})()
</script>
